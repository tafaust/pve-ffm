---
# Copy to ~/secrets/infisical-secrets.yml (never commit). Generate once:
#   openssl rand -hex 16    # infisical_encryption_key (32 hex chars)
#   openssl rand -base64 32 # infisical_auth_secret
infisical_encryption_key: "CHANGE_ME_32_HEX_CHARS"
infisical_auth_secret: "CHANGE_ME_BASE64_32_BYTES"
infisical_postgres_password: "CHANGE_ME_STRONG_PASSWORD"
