---
# k3s cluster (Ubuntu 24.04 Server VMs recommended).
# Must equal the version running on the nodes: the k3s_node role re-runs the get.k3s.io installer
# whenever this differs, so a stale value would DOWNGRADE the live cluster. Live: v1.36.5+k3s1 (2026-11-03).
# Server flags live in /etc/rancher/k3s/config.yaml on k3s-control-01 (homelab repo: kubernetes/bootstrap/k3s).
k3s_version: v1.36.5+k3s1
# Operator kubeconfig cluster/context name (k3s admin kubeconfig is always "default" until renamed on fetch).
k3s_cluster_name: k3s-homelab
# Worker scheduling label (Argo Helm values use the same key/value).
homelab_worker_node_label_key: homelab.tafaust.org/role
homelab_worker_node_label_value: worker
# LDAP client: flip true after openldap-server.yml + Vault bind password (see ansible/README.md).
sssd_ldap_enabled: false
ldap_uri: "ldaps://192.168.20.7/"
ldap_tls_reqcert: allow
ldap_search_base: "dc=tafaust,dc=org"
ldap_user_search_base: "ou=users,dc=tafaust,dc=org"
ldap_bind_dn: "cn=admin,dc=tafaust,dc=org"
# ldap_bind_password: set via Vault / host_vars (never commit)
