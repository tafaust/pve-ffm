    lab_prod:
      hosts:
        k3s-control-01:
          ansible_host: 192.168.20.10
        k3s-worker-01:
          ansible_host: 192.168.20.15
    ldap_servers:
      hosts:
        ldap-01:
          ansible_host: 192.168.20.7 # authorized_keys = tafaust GitHub keys
    infisical_servers:
      hosts:
        infisical-01:
          ansible_host: 192.168.20.8
