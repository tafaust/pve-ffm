---
ansible_user: thomas
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_thomas_github
ansible_python_interpreter: /usr/bin/python3.12
k3s_node_role: agent
k3s_url: "https://192.168.20.10:6443"
# 250G HDD (scsi1): k3s-data-vg/local-path-lv (ubuntu-vg is root on sda for this host).
k3s_local_path_mount_enabled: true
k3s_local_path_vg: k3s-data-vg
k3s_local_path_lv: local-path-lv
k3s_local_path_lvm_extend: true
# Prefer Ansible Vault on this host. One-shot: export K3S_JOIN_TOKEN before playbook.
k3s_registration_token: "{{ lookup('ansible.builtin.env', 'K3S_JOIN_TOKEN') | default('', true) }}"
