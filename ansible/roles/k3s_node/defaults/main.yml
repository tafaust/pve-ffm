---
k3s_version: "v1.31.5+k3s1"
# server | agent
k3s_node_role: server
# Bind / advertise on this address (inventory ansible_host is typical for single-NIC lab VMs).
k3s_bind_address: "{{ ansible_host }}"
k3s_advertise_address: "{{ k3s_bind_address }}"
# Extra API SANs (DNS names clients use for kube-apiserver).
k3s_tls_san: []
# Cilium: no flannel, no kube default network policy controller.
k3s_server_install_flags: >-
  --flannel-backend=none
  --disable-network-policy
  --write-kubeconfig-mode 600
  --disable=traefik
  --disable=servicelb
  --node-taint {{ k3s_control_plane_taint }}
# Control plane runs no workloads (only DaemonSets and k3s addons that tolerate this taint).
# --node-taint only applies when a node registers; the role also enforces it on existing
# servers (task tag k3s_taint).
k3s_control_plane_taint: "node-role.kubernetes.io/control-plane:NoSchedule"
# Agent has no --flannel-backend (server-only). CNI comes from cluster (Cilium).
k3s_agent_install_flags: ""
# Agent only: API URL of first server (https://IP:6443).
k3s_url: ""
# Agent only: node token from server (`sudo cat /var/lib/rancher/k3s/server/node-token`).
k3s_registration_token: ""
# Optional node labels at join time (agents: set homelab.tafaust.org/role=worker in host_vars).
k3s_node_labels: {}
# Optional dedicated volume for k3s local-path PVCs (set per worker host_vars).
k3s_local_path_mount_enabled: false
k3s_local_path_mount_path: /var/lib/rancher/k3s/storage
k3s_local_path_mount_src: ""
k3s_local_path_mount_fstype: ext4
k3s_local_path_mount_opts: defaults,noatime
k3s_local_path_lvm_extend: false
k3s_local_path_vg: ""
k3s_local_path_lv: ""
