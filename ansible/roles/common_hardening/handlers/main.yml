---
# Validate before reload: handlers run in file order, so a failing `sshd -t`
# stops the reload and the running sshd keeps its last good config.
- name: Validate sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload sshd

- name: Reload sshd service
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: reloaded
  listen: Reload sshd

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Remount run shm
  ansible.builtin.command: mount -o remount /run/shm
  changed_when: true

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  register: _augenrules
  failed_when: false
  changed_when: _augenrules.rc == 0

- name: Remount dev shm
  ansible.builtin.command: mount -o remount /dev/shm
  changed_when: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
