---
# Runs only with infisical_edge_caddy_enabled=false, after the Caddy container is gone (compose --remove-orphans).
# The cert-reader token (/etc/homelab, SA revoked in tafaust/homelab 2026-11-03) and the pulled LE copy
# ({{ infisical_edge_dir }}/certs/le) are removed (approved 2026-11-03, HANDOVER item 15), as is the Caddy rollback copy
# backups/Caddyfile.retired (approved 2026-11-03 16:22 CET; its content is in homelab docs/HANDOVER.md "Infisical edge"). The old
# self-signed CA/leaf files directly under {{ infisical_edge_dir }}/certs (homelab-root-ca.crt, tls.*) are NOT deleted here
# (separate decision, homelab HANDOVER item 8).
- name: Stop and disable homelab-cert-sync.timer
  ansible.builtin.systemd_service:
    name: homelab-cert-sync.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove Caddy config and cert-sync units/script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ infisical_edge_dir }}/Caddyfile"
    - /etc/systemd/system/homelab-cert-sync.timer
    - /etc/systemd/system/homelab-cert-sync.service
    - /usr/local/sbin/homelab-cert-sync
  notify: Reload systemd

- name: Remove the revoked cert-reader token, the pulled LE certificate copy and the retired Caddyfile copy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/homelab/cert-reader.token
    - "{{ infisical_edge_dir }}/certs/le"
    - "{{ infisical_edge_dir }}/backups/Caddyfile.retired"
