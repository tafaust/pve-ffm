---
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure Infisical install directory
  ansible.builtin.file:
    path: "{{ infisical_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ infisical_compose_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Recreate Infisical stack

- name: Deploy Infisical environment file
  ansible.builtin.template:
    src: infisical.env.j2
    dest: "{{ infisical_compose_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: Recreate Infisical stack

- name: Pull Infisical stack images
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ infisical_compose_dir }}/docker-compose.yml"
      - pull
  args:
    chdir: "{{ infisical_compose_dir }}"
  changed_when: true

- name: Start Infisical stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ infisical_compose_dir }}/docker-compose.yml"
      - up
      - -d
      - --remove-orphans
  args:
    chdir: "{{ infisical_compose_dir }}"
  register: _infisical_compose_up
  changed_when: >-
    'Created' in (_infisical_compose_up.stderr | default('') + _infisical_compose_up.stdout | default(''))
    or 'Started' in (_infisical_compose_up.stderr | default('') + _infisical_compose_up.stdout | default(''))

- name: Wait for Infisical HTTP port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ infisical_listen_port }}"
    timeout: 180
