# Keycloak — codecentric/keycloakx via Kustomize Helm inflation (see manifests/keycloak).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    gitops.scaffold/chart-pin: "helm search repo codecentric/keycloakx --versions | head"
spec:
  project: platform
  source:
    repoURL: https://github.com/tafaust/pve-ffm.git
    targetRevision: main
    path: clusters/prod/manifests/keycloak/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
