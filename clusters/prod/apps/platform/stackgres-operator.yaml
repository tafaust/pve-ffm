# StackGres operator — verify chart URL/version on https://stackgres.io before prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackgres-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    gitops.scaffold/chart-pin: "Follow StackGres helm install doc; pin targetRevision."
spec:
  project: platform
  source:
    repoURL: https://stackgres.io/downloads/stackgres-k8s/stackgres/helm/
    chart: stackgres-operator
    targetRevision: 1.18.6
    helm:
      releaseName: stackgres-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: stackgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
