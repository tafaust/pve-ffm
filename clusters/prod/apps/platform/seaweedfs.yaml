# SeaweedFS — S3-compatible object storage (Helm).
# Helm repo: https://seaweedfs.github.io/seaweedfs/helm chart: seaweedfs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    gitops.scaffold/chart-pin: "helm search repo seaweedfs/seaweedfs --versions | head"
spec:
  project: platform
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.40.0
    helm:
      releaseName: seaweedfs
      values: |
        global:
          storageClass: longhorn
        master:
          replicas: 1
          nodeSelector:
            homelab.tafaust.org/role: worker
        volume:
          replicas: 1
          nodeSelector:
            homelab.tafaust.org/role: worker
        filer:
          replicas: 1
          nodeSelector:
            homelab.tafaust.org/role: worker
        s3:
          enabled: true
          nodeSelector:
            homelab.tafaust.org/role: worker
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
